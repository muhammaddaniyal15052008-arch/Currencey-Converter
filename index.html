<!DOCTYPE html>
<html>

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title></title>
<link rel="stylesheet" href="style.css">
</head>

<body>
 <nav class="navbar">
   <h3>CURRENCY CONVERTER</h3>
   <p>BY DANIYAL</p>
 </nav>
  <div class="body">
  
  <div class="container">
    
    <form action="" method="get" accept-charset="utf-8">
      
      <div class="amount">
        <p>Enter your amount</p>
        <input value="0" type="text" name="" id="">
      </div>
      
      <div class="dropdown">
        <div class="from">
          <p>From</p>
          <div class="select-container">
         
            <select name="from">
              <option value="USD">USD</option>
              <option value="PKR">PKR</option>
            </select>
          </div>
        </div>
        <div class="to">
           <p>To</p>
           <div class="select-container">
         
            <select name="from">
             <option value="USD">USD  </option>
             <option value="PKR" selected>PKR </option>
            </select>
        </div>
      </div>
      
      <div class="msg">
        <p>1USD = 280PKR</p>
      </div>
      <button id="get-exchange">GET EXCHANGE RATE</button>
    </form>
  </div>
  </div>
</body>
<script src="script.js">script.js</script>
</html>
